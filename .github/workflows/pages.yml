# Publishes the site with fresh set data: on every push, every Monday, or by hand.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install what the checks need (three.js, JSZip; playwright-core drives the runner's Chrome)
        run: npm ci && (cd audit && npm ci)
      - name: Check plate layout (every part on the bed, clear of the no-print corner)
        run: node audit/test_layout.mjs
      - name: Build set data from Rebrickable's database downloads
        run: python scripts/build_data.py _site/data
      - name: Add the site files
        run: |
          cp index.html *.js README.md LICENSE .nojekyll _site/
          cp -r vendor bambu _site/
      # The parts library the page loads from: the official LDraw library (parts and primitives), fresh at every
      # publish, so new parts need no one to update a mirror. Served next to the page, so no CORS is needed.
      - name: Which LDraw library release is current (its ETag)
        id: ldraw
        run: |
          e=$(curl -sSfI --retry 3 https://library.ldraw.org/library/updates/complete.zip | grep -i '^etag:' | tr -dc 'A-Za-z0-9-')
          echo "etag=${e:-day-$(date +%F)}" >> "$GITHUB_OUTPUT"
      - name: Reuse the library unpacked by an earlier run of the same release
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ldraw
          key: ldraw-${{ steps.ldraw.outputs.etag }}
      - name: Add the official LDraw parts library
        run: |
          if [ ! -f "$RUNNER_TEMP/ldraw/LDConfig.ldr" ]; then
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/complete.zip" https://library.ldraw.org/library/updates/complete.zip
            unzip -q "$RUNNER_TEMP/complete.zip" 'ldraw/parts/*' 'ldraw/p/*' 'ldraw/LDConfig.ldr' -d "$RUNNER_TEMP"
          fi
          mkdir -p _site/ldraw
          cp -r "$RUNNER_TEMP/ldraw/parts" "$RUNNER_TEMP/ldraw/p" "$RUNNER_TEMP/ldraw/LDConfig.ldr" _site/ldraw/
          echo "LDraw library: $(find _site/ldraw -type f | wc -l) files, $(du -sh _site/ldraw | cut -f1)"
      - name: Stamp script and data URLs with the commit (no stale cached files)
        run: node scripts/stamp.mjs _site "${GITHUB_SHA::7}"
      # The built site is checked before it goes live; a failure keeps the previous site up. Bambu Studio isn't on
      # this runner, so downloads are checked but not sliced (test_project.mjs and the slicing run on a PC).
      - name: Check loading, supports and the built site in headless Chrome
        env:
          LDRAW_DIR: ${{ runner.temp }}/ldraw
          SITE_DIR: _site
          CHROME: /usr/bin/google-chrome
          FLAKY: '0.05'     # the local server answers 5% of library requests 503, as GitHub Pages does under a burst
          QUICK_SETS: '1'   # sets 10696 and 11374: every part resolves in the library; full builds run on the PC
        run: |
          node audit/test_loading.mjs
          node audit/test_supports_big.mjs
          node audit/test_fins_failure.mjs
          node audit/test_site.mjs local
          node audit/test_site.mjs local phone   # 390 x 844 touch phone, CPU 4x slower: set 11926 only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
