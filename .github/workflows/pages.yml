# Publishes the site with fresh set data: on every push, every Monday, or by hand.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check plate layout (every part on the bed, clear of the no-print corner)
        run: node audit/test_layout.mjs
      - name: Build set data from Rebrickable's database downloads
        run: python scripts/build_data.py _site/data
      - name: Add the site files
        run: |
          cp index.html *.js README.md LICENSE .nojekyll _site/
          cp -r vendor bambu _site/
      - name: Stamp script and data URLs with the commit (no stale cached files)
        run: node scripts/stamp.mjs _site "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
